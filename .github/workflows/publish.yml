name: Publish

on:
  push:
    branches: [main, interactive-map]
  schedule:
    # Rebuild every Monday at 06:00 UTC so the site picks up fresh sheet data.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      RESTRICTED_PORTAL_USER: ${{ secrets.RESTRICTED_PORTAL_USER }}
      RESTRICTED_PORTAL_PASS: ${{ secrets.RESTRICTED_PORTAL_PASS }}
      # Email stays out of rendered/downloadable data unless explicitly approved.
      INCLUDE_PUBLIC_EMAIL: ${{ vars.INCLUDE_PUBLIC_EMAIL || '0' }}

    steps:
      - name: Check out the main website
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Check out the interactive-map prototype
        uses: actions/checkout@v4
        with:
          ref: interactive-map
          path: prototype-source

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install R deps
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          install-quarto: true
          packages: |
            any::readr
            any::dplyr
            any::stringr
            any::jsonlite
            any::crosstalk
            any::DT
            any::htmltools
            any::knitr
            any::rmarkdown

      - name: Verify production and prototype sheet secrets
        env:
          MAIN_CHAR_DATA_URL: ${{ secrets.CHAR_DATA_URL }}
          MAIN_CASE_DATA_URL: ${{ secrets.CASE_DATA_URL }}
          PROTOTYPE_CHAR_DATA_URL: ${{ secrets.CHAR_DATA_URL_PROT }}
          PROTOTYPE_CASE_DATA_URL: ${{ secrets.CASE_DATA_URL_PROT }}
        run: |
          if [ -z "$MAIN_CHAR_DATA_URL" ] || [ -z "$MAIN_CASE_DATA_URL" ]; then
            echo "Error: CHAR_DATA_URL and CASE_DATA_URL must be set as repository secrets." >&2
            exit 1
          fi
          if [ -z "$PROTOTYPE_CHAR_DATA_URL" ] || [ -z "$PROTOTYPE_CASE_DATA_URL" ]; then
            echo "Error: CHAR_DATA_URL_PROT and CASE_DATA_URL_PROT must be set as repository secrets." >&2
            exit 1
          fi

      - name: Verify shared portal secrets
        run: |
          if [ -z "$RESTRICTED_PORTAL_USER" ] || [ -z "$RESTRICTED_PORTAL_PASS" ]; then
            echo "Error: RESTRICTED_PORTAL_USER and RESTRICTED_PORTAL_PASS must be set as repository secrets." >&2
            exit 1
          fi

      - name: Build and gate the main website
        working-directory: main-source
        env:
          CHAR_DATA_URL: ${{ secrets.CHAR_DATA_URL }}
          CASE_DATA_URL: ${{ secrets.CASE_DATA_URL }}
        run: |
          bash scripts/fetch-sheet-data.sh
          Rscript scripts/build_profiles.R
          quarto render
          bash scripts/package-gated-site.sh

      - name: Build and gate the interactive-map prototype
        working-directory: prototype-source
        env:
          CHAR_DATA_URL: ${{ secrets.CHAR_DATA_URL_PROT }}
          CASE_DATA_URL: ${{ secrets.CASE_DATA_URL_PROT }}
          # Sarah confirmed that the populated prototype email fields have consent.
          # Keep production/main controlled by the repository variable above.
          INCLUDE_PUBLIC_EMAIL: "1"
        run: |
          bash scripts/fetch-sheet-data.sh
          Rscript scripts/build_profiles.R
          quarto render
          bash scripts/package-gated-site.sh

      - name: Combine main site and prototype
        run: |
          mv main-source/_site combined-site
          mkdir -p combined-site/prototype
          cp -a prototype-source/_site/. combined-site/prototype/
          test -f combined-site/index.html
          test -f combined-site/prototype/index.html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-site

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
