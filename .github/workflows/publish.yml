name: Publish

on:
  push:
    branches: [main]
  schedule:
    # Rebuild every Monday at 06:00 UTC so the site picks up fresh sheet data.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Set these as repo secrets, or paste your Google Sheet "publish to web" CSV URLs here.
      CHAR_DATA_URL: ${{ secrets.CHAR_DATA_URL }}
      CASE_DATA_URL: ${{ secrets.CASE_DATA_URL }}
      RESTRICTED_PORTAL_USER: ${{ secrets.RESTRICTED_PORTAL_USER }}
      RESTRICTED_PORTAL_PASS: ${{ secrets.RESTRICTED_PORTAL_PASS }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install R deps
        run: |
          Rscript -e 'install.packages(c("readr", "dplyr", "stringr", "jsonlite", "crosstalk", "DT", "htmltools", "knitr"), repos = "https://cloud.r-project.org")'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Fetch live data from Google Sheets
        run: |
          mkdir -p data
          if [ -n "$CHAR_DATA_URL" ]; then
            curl -sSL "$CHAR_DATA_URL" -o data/characteristic_data.csv
          fi
          if [ -n "$CASE_DATA_URL" ]; then
            curl -sSL "$CASE_DATA_URL" -o data/case_management.csv
          fi
          echo "data/ contents after fetch:"
          ls -la data/

      - name: Generate country profile pages
        run: Rscript scripts/build_profiles.R

      - name: Render Quarto site
        run: quarto render

      - name: Verify portal secrets
        run: |
          if [ -z "$RESTRICTED_PORTAL_USER" ] || [ -z "$RESTRICTED_PORTAL_PASS" ]; then
            echo "Error: RESTRICTED_PORTAL_USER and RESTRICTED_PORTAL_PASS must be set as repository secrets." >&2
            exit 1
          fi

      - name: Package gated site
        run: bash scripts/package-gated-site.sh

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
