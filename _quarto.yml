project:
  type: website
  output-dir: _site
  resources:
    - assets/vivax-charts.js
    - assets/vivax-charts.css

website:
  title: "P. vivax Policy Repository"
  description: "A live, country-level repository of Plasmodium vivax case management policies and their implementation status."
  site-url: "https://menzies-malaria.github.io/vivax-repo/"
  repo-url: "https://github.com/Menzies-Malaria/vivax-repo"
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: false

  navbar:
    logo: assets/logo.svg
    background: light
    pinned: true
    search: true
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Interactive map"
        href: interactive-map.qmd
      - text: "Explore the data"
        href: explore.qmd
      - text: "Country profiles"
        href: countries.qmd
      - text: "Policy timeline"
        href: timeline.qmd
      - text: "Methods"
        href: methods.qmd
      - text: "Contribute / Update"
        href: contribute.qmd
    right:
      - icon: github
        href: "https://github.com/Menzies-Malaria/vivax-repo"
        aria-label: GitHub
      - icon: download
        href: data.qmd
        text: Data

  page-footer:
    background: light
    left: |
      *P. vivax* Policy Repository · Updated continuously from a live Google Sheet.
    center: |
      Built with [Quarto](https://quarto.org). Code on [GitHub](https://github.com/Menzies-Malaria/vivax-repo).
    right: |
      © 2025 · Licensed CC-BY-4.0

format:
  html:
    theme:
      light: [cosmo, theme.scss]
    css:
      - assets/styles.css
      - assets/vivax-charts.css
    include-in-header:
      - text: |
          <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
      - text: |
          <script>
          window.addEventListener('load', () => {
            history.replaceState(null, null, "/vivax-repo/");
          });
          </script>
    include-after-body:
      - text: |
          <script src="assets/vivax-charts.js"></script>
    toc: true
    toc-depth: 3
    toc-location: right
    fig-cap-location: bottom
    code-tools: false
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true
    citations-hover: true

execute:
  freeze: auto
  warning: false
  message: false
  echo: false
